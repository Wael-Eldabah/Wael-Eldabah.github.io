<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio responsive QA</title><style>body{background:#162028;color:#caffec;margin:0;font:12px monospace}header{position:sticky;top:0;background:#15252d;padding:10px;display:flex;flex-wrap:wrap;align-items:center;gap:9px;z-index:2}button{padding:8px;border:1px solid #81ffdd;background:#09141c;color:#caffec;cursor:pointer}iframe{display:block;border:0;margin:12px auto;background:#05090c}output{font-size:10px;max-width:100%}main{overflow:auto}button[aria-pressed=true]{background:#caffec;color:#061210}</style></head><body><header><button data-w="390" data-h="844" aria-pressed="true">Mobile 390</button><button data-w="360" data-h="800" aria-pressed="false">Mobile 360</button><button data-w="768" data-h="1024" aria-pressed="false">Tablet 768</button><button data-w="1280" data-h="900" aria-pressed="false">Desktop 1280</button><output id="metrics">Loading</output></header><main><iframe id="site" src="index.html?qa=2" title="Portfolio test viewport" width="405" height="844"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{f.width=Number(b.dataset.w)+15;f.height=b.dataset.h;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));setInterval(()=>{try{const d=f.contentDocument;document.querySelector('output').textContent=`Layout ${d.documentElement.clientWidth}px / content ${d.documentElement.scrollWidth}px · ${d.documentElement.dataset.ready==='true'?'Ready':'Loading'} · ${[...d.querySelectorAll('#heroCanvas,#orbCanvas')].map(c=>`${c.id}: ${c.dataset.state||'loading'} ${c.dataset.fps||''}`).join(' / ')} · Missing images ${[...d.images].filter(i=>i.complete&&!i.naturalWidth).length}`}catch{}},1000)</script></body></html>
