<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio responsive QA</title><style>body{background:#162028;color:#caffec;margin:0;font:13px monospace}header{position:sticky;top:0;background:#15252d;padding:12px;display:flex;align-items:center;gap:12px;z-index:2}button{padding:9px;border:1px solid #81ffdd;background:#09141c;color:#caffec;cursor:pointer}iframe{display:block;border:1px solid #678;max-width:100%;margin:15px auto;background:#05090c}output{white-space:pre;font-size:11px}main{overflow:auto}</style></head><body><header><button data-w="390" data-h="844">Mobile 390</button><button data-w="360" data-h="800">Mobile 360</button><button data-w="768" data-h="1024">Tablet 768</button><button data-w="1280" data-h="900">Desktop 1280</button><output id="metrics">Loading</output></header><main><iframe id="site" src="index.html?qa=1" title="Portfolio test viewport" width="390" height="844"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{f.width=b.dataset.w;f.height=b.dataset.h}));setInterval(()=>{try{const d=f.contentDocument;document.querySelector('output').textContent=JSON.stringify({viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,ready:d.documentElement.dataset.ready,canvases:[...d.querySelectorAll('#heroCanvas,#orbCanvas')].map(c=>({id:c.id,state:c.dataset.state,fps:c.dataset.fps,ratio:c.dataset.ratio})),missingImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length},null,1)}catch{}},1000)</script></body></html>
